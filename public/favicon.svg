<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF2B2" />
      <stop offset="30%" stopColor="#F5D77F" />
      <stop offset="70%" stopColor="#D4AF37" />
      <stop offset="100%" stopColor="#8F6B10" />
    </linearGradient>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stopColor="#6EE7B7" />
      <stop offset="35%" stopColor="#38BDF8" />
      <stop offset="70%" stopColor="#2563EB" />
      <stop offset="100%" stopColor="#1E3A8A" />
    </linearGradient>
  </defs>
  <rect width="140" height="140" rx="32" fill="#06111E" />
  <!-- Outer Gold Ring -->
  <path d="M 70 18 A 52 52 0 1 1 26 56" stroke="url(#favGold)" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <!-- Vertebrae / Spine Cyan Ribbon -->
  <path d="M 44 32 C 40 48, 44 68, 52 84 C 58 96, 68 108, 80 114" stroke="url(#favCyan)" stroke-width="5" stroke-linecap="round" fill="none" />
  <!-- Dynamic Golden Medical Monogram K -->
  <path d="M 52 40 L 52 100" stroke="url(#favGold)" stroke-width="5" stroke-linecap="round" />
  <path d="M 52 70 L 88 42" stroke="url(#favGold)" stroke-width="5" stroke-linecap="round" />
  <path d="M 68 58 L 92 98" stroke="url(#favGold)" stroke-width="5.5" stroke-linecap="round" />
  <!-- Inner Glow Dot -->
  <circle cx="92" cy="42" r="3.5" fill="#FFF2B2" />
</svg>
